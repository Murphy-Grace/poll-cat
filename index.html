<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Polling, reported votes, and scheduled poll closings for the 2026 Senate and Governor elections."
    />
    <title>Poll Cat · Election Night</title>
    <link rel="icon" type="image/png" href="/POLLCAT.png" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("election-watchlist:theme") === "light"
            ? "light"
            : "dark"
      } catch {
        document.documentElement.dataset.theme = "dark"
      }
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
